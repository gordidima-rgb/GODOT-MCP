    <circle cx="127" cy="177" r="13" fill="#17253a"/>
    <circle cx="189" cy="177" r="13" fill="#17253a"/>
    <circle cx="131" cy="173" r="4" fill="#ffffff"/>
    <circle cx="193" cy="173" r="4" fill="#ffffff"/>
    <path d="M133 210 C146 222 171 222 184 210" fill="none" stroke="#17253a" stroke-width="7" stroke-linecap="round"/>
    <path d="M158 258 C134 247 122 229 122 204 V183 L158 168 L194 183 V204 C194 229 182 247 158 258 Z" fill="#ffffff" stroke="#17253a" stroke-width="7" stroke-linejoin="round"/>
    <text x="136" y="217" fill="#1d5c86" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="25" font-weight="900">MCP</text>
    <path d="M52 166 H78 M238 166 H264 M158 44 V72" stroke="url(#bridgeGlow)" stroke-width="9" stroke-linecap="round"/>
    <circle cx="52" cy="166" r="12" fill="#30c48d"/>
    <circle cx="264" cy="166" r="12" fill="#f2c94c"/>
    <circle cx="158" cy="44" r="12" fill="#7b61ff"/>
