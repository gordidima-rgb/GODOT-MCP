<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320" role="img" aria-labelledby="title desc">
  <title id="title">GODOT-MCP logo</title>
  <desc id="desc">A Godot-inspired safe bridge logo for Godot MCP integration with an AI client, security shield, and project nodes.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef6f0"/>
    </linearGradient>
    <linearGradient id="godotBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67a9dc"/>
      <stop offset="0.55" stop-color="#478cbf"/>
      <stop offset="1" stop-color="#2f6f9f"/>
    </linearGradient>
    <linearGradient id="bridgeGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30c48d"/>
      <stop offset="1" stop-color="#f2c94c"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#17324d" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1100" height="320" rx="34" fill="url(#panel)"/>
  <rect x="22" y="22" width="1056" height="276" rx="28" fill="#ffffff" stroke="#d7e4ef" stroke-width="2"/>

