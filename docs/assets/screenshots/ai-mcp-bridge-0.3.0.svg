<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1120" viewBox="0 0 760 1120" role="img" aria-labelledby="title desc">
  <title id="title">AI MCP Bridge dock screenshot</title>
  <desc id="desc">A screenshot-style preview of the AI MCP Bridge dock in Godot 4.6, showing the quick start guide, bridge controls, Codex setup, and editor chat.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="godotBot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#80b7ff"/>
      <stop offset="1" stop-color="#3d74e8"/>
    </linearGradient>
    <style>
      .ui { font-family: "Segoe UI", Inter, Arial, sans-serif; }
      .tab { font: 500 18px "Segoe UI", Inter, Arial, sans-serif; fill: #c6c6c6; }
      .title { font: 500 24px "Segoe UI", Inter, Arial, sans-serif; fill: #d5d5d5; }
      .label { font: 500 18px "Segoe UI", Inter, Arial, sans-serif; fill: #d0d0d0; }
      .body { font: 500 16px "Segoe UI", Inter, Arial, sans-serif; fill: #d7d7d7; }
      .small { font: 500 15px "Segoe UI", Inter, Arial, sans-serif; fill: #d0d0d0; }
      .muted { fill: #9a9a9a; }
      .panel { fill: #1f1f1f; }
      .input { fill: #3e3e3e; }
      .code { fill: #d8d8d8; font: 500 15px Consolas, "Courier New", monospace; }
    </style>
  </defs>

  <rect width="760" height="1120" rx="28" fill="#171717"/>
  <g filter="url(#shadow)">
    <rect x="52" y="38" width="656" height="1048" rx="10" fill="#252525"/>
  </g>

  <g class="ui">
    <rect x="52" y="38" width="656" height="48" fill="#111111"/>
    <text x="72" y="69" class="tab">Inspector</text>
    <text x="206" y="69" class="tab">Signals</text>
    <text x="326" y="69" class="tab">Groups</text>
    <rect x="430" y="38" width="164" height="48" rx="6" fill="#2b2b2b"/>
    <text x="454" y="69" class="tab">AI MCP Bridge</text>
    <circle cx="674" cy="62" r="3" fill="#9b9b9b"/>
    <circle cx="674" cy="72" r="3" fill="#9b9b9b"/>
    <circle cx="674" cy="82" r="3" fill="#9b9b9b"/>

    <text x="72" y="126" class="title">AI MCP Bridge</text>

    <rect x="72" y="148" width="520" height="206" rx="6" fill="#1d1d1d"/>
    <text x="88" y="176" class="body">Mini guide: 1, 2, 3</text>
    <text x="88" y="201" class="body">1. Bridge: click Start.</text>
    <text x="88" y="226" class="body">2. Pick client: Codex, then click Save client setup.</text>
    <text x="88" y="251" class="body">3. Copy docs/AI_CLIENT_SETUP.md into Codex</text>
    <text x="105" y="276" class="body">config, restart Codex, then ask: run</text>
    <text x="105" y="301" class="body">godot_project_scan.</text>
    <text x="88" y="326" class="body">Optional: for local chat, keep provider none and</text>
    <text x="88" y="351" class="body">press Queue, or set AI_CHAT_* in .env and press Reload .env.</text>

    <text x="72" y="394" class="label">Status: stopped</text>
    <text x="72" y="444" class="label">Port: 8765 on 127.0.0.1</text>
    <rect x="72" y="466" width="118" height="44" rx="6" fill="#565656"/>
    <text x="93" y="494" class="label">Start</text>
    <rect x="202" y="466" width="132" height="44" rx="6" fill="#3b3b3b"/>
    <text x="224" y="494" class="label muted">Stop</text>
    <line x1="72" y1="528" x2="588" y2="528" stroke="#151515" stroke-width="2"/>

    <text x="72" y="568" class="label">AI client</text>
    <rect x="72" y="590" width="520" height="44" rx="6" class="input"/>
    <text x="88" y="619" class="label">Codex</text>
    <path d="M552 608 L566 622 L580 608" fill="none" stroke="#cccccc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="72" y="646" width="520" height="308" rx="6" fill="#1d1d1d"/>
    <text x="88" y="674" class="body">Use this MCP server from Codex:</text>
    <text x="88" y="718" class="code">```toml</text>
    <text x="88" y="742" class="code">[mcp_servers.godotMCP]</text>
    <text x="88" y="766" class="code">command = "node"</text>
    <text x="88" y="790" class="code">args = [ "C:/Users/gdima/Documents/learn-</text>
    <text x="88" y="814" class="code">personal/tools/mcp-godot/src/server.mjs", "--</text>
    <text x="88" y="838" class="code">project-root", "C:/Users/gdima/Documents/learn-</text>
    <text x="88" y="862" class="code">personal" ]</text>
    <text x="88" y="886" class="code">startup_timeout_sec = 20</text>
    <text x="88" y="910" class="code">```</text>
    <text x="88" y="938" class="body">Then restart Codex and ask it to run</text>
    <text x="88" y="962" class="body">`godot_project_scan` first.</text>

    <rect x="72" y="966" width="520" height="44" rx="6" fill="#494949"/>
    <text x="238" y="994" class="label">Save client setup</text>

    <text x="72" y="1048" class="label">Instruction for AI agent</text>

    <rect x="622" y="1010" width="72" height="72" rx="24" fill="#1b1b1b"/>
    <g transform="translate(636 997)">
      <path d="M22 58 C18 44 24 31 36 26 L36 12 L45 19 L52 8 L60 19 L69 12 L69 27 C81 33 86 45 82 58 C78 76 66 88 52 88 C38 88 26 76 22 58 Z" fill="url(#godotBot)" stroke="#1c4db5" stroke-width="3"/>
      <rect x="32" y="41" width="40" height="22" rx="10" fill="#182648"/>
      <path d="M40 51 C43 55 48 55 51 51 M56 51 C59 55 64 55 67 51" fill="none" stroke="#9be8ff" stroke-width="3" stroke-linecap="round"/>
      <rect x="42" y="69" width="20" height="10" rx="5" fill="#dff4ff"/>
    </g>
  </g>
</svg>
