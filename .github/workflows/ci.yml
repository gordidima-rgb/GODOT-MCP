name: CI

on:
  push:
  pull_request:

jobs:
  mcp-godot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check MCP server syntax
        run: node --check tools/mcp-godot/src/server.mjs

      - name: Check providers syntax
        run: node --check tools/mcp-godot/src/providers.mjs

      - name: Check security helper syntax
        run: node --check tools/mcp-godot/src/security.mjs

      - name: Check Meshy model adapter syntax
        run: node --check tools/mcp-godot/src/provider_adapters/meshy_model.mjs

      - name: Check Tripo model adapter syntax
        run: node --check tools/mcp-godot/src/provider_adapters/tripo_model.mjs

      - name: Check custom HTTP model adapter syntax
        run: node --check tools/mcp-godot/src/provider_adapters/custom_http_model.mjs

      - name: Run MCP smoke test
        run: node tools/mcp-godot/test/smoke.mjs

      - name: Run model provider tests
        run: node tools/mcp-godot/test/model-providers.mjs

      - name: Check version consistency
        run: node tools/mcp-godot/test/version-check.mjs
